# Profile — the only settings file. Filled by /jobkit:setup; edit any time. TODO = not decided yet.
name: "TODO"                    # Latin, as on LinkedIn
chat_language: ""               # language the agent talks in; empty = the language you write in
docs_language: "en"             # default language of CV and letters

contacts:
  email: "TODO"                 # a separate job-search mailbox is best
  phone: "TODO"                 # international format: +351 900 000 000
  city: "TODO"                  # City, Country
  linkedin: "TODO"
  portfolio: ""
  telegram: ""
  github: ""

target:
  roles: ["TODO"]               # e.g. "Product Manager", "Growth PM"
  seniority: "TODO"             # junior | middle | senior | lead
  stretch_up: true              # apply one level up when the JD allows
  domains_like: []
  domains_avoid: []
  company_stage: []             # startup | scaleup | enterprise | agency; empty = any
  employment: ["full-time"]     # full-time | contract | part-time

search:
  sources: ["ats", "jobicy", "remoteok", "remotive"]
  board_tags: ["product"]       # tags for open boards
  title_include: ["product manager", "product owner"]   # any of these in the title
  title_exclude: ["intern", "engineer", "designer", "marketing manager"]
  max_age_days: 14
  per_run: 10                   # applications per /jobkit:jobs-run

geo:
  formats: ["remote"]           # remote | hybrid | office
  office_cities: []
  relocation: "no"              # no | open | yes
  relocation_countries: []
  ok_keywords: ["remote", "europe", "emea", "worldwide", "anywhere"]
  # blocked unless a strong ok-word (not plain "remote") is next to it
  block_keywords: ["us", "usa", "united states", "us only", "canada", "india", "new york",
                   "san francisco", "seattle", "austin", "toronto", "brazil", "latam", "apac", "singapore"]

work_authorization:             # answers depend on the vacancy's country — see application-answers §2
  citizenship: "TODO"
  can_work_in: ["TODO"]
  needs_sponsorship_elsewhere: true
  contractor_ok: true

salary:                         # tiers and rules: application-answers §3
  currency: "EUR"
  floor_year: 0                 # published band below this → skip; 0 = no floor
  target_year: 0

autonomy:
  submit_mode: "confirm_each"   # confirm_each (you press Submit) | auto_high | draft_only
  auto_high_min_score: 8
  send_messages: false          # true = agent may send messages you explicitly ask for

skip_companies: []              # never apply here
banned_claims: []               # skills/words you do NOT have; never written anywhere

tracker:
  backend: "csv"                # csv | notion | sheets — playbooks/data-storage.md

telemetry: true                 # anonymous usage stats (no personal data); false = off
